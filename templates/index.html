<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css')}}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="{{ url_for('home') }}" class="nak">Pulmora</a>
            <ul class="navbar-menu">
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
                <li><a href="#">Detection Page</a></li>
                <li><a href="{{ url_for('extra') }}">Extra Information</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="title-box">
            <h1 class="top-header">
                Upload X-ray Image
            </h1>
        </div>
        <div class="upload-container">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="upload-area" id="dropZone">
                    <p>Drag and drop your X-ray image here or</p>
                    <input type="file" id="fileInput" name="file" accept="image/*" style="display: none;">
                    <button type="button" class="upload-button">Choose File</button>
                </div>
                <button type="button" class="reset-button" onclick="location.reload();">Reset</button>
            </form>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="image-preview">
                <img id="previewImage" src="" alt="X-ray Preview">
            </div>
            <div class="prediction-result">
                <h2>Analysis Result</h2>
                <div class="result-box">
                    <p>Diagnosis: <span id="diagnosis"></span></p>
                    <p>Confidence: <span id="confidence"></span></p>
                </div>
            </div>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing X-ray image...</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js')}}"></script>
</body>

</html>
